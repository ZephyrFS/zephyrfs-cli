[package]
name = "zephyrfs-cli"
version = "0.1.0"
edition = "2021"
authors = ["espadonne (mfw)"]
license = "MIT"
description = "Command-line interface for ZephyrFS distributed storage"
repository = "https://github.com/ZephyrFS/zephyrfs-cli"

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive", "color"] }
dialoguer = "0.11"
indicatif = "0.17"

# Async runtime
tokio = { version = "1.39", features = ["full"] }

# HTTP client for coordinator API
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Configuration
config = "0.14"
dirs = "5.0"

# File operations
walkdir = "2.5"
sha2 = "0.10"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
humansize = "2.1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
lazy_static = "1.4"

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "zephyrfs"
path = "src/main.rs"

[[bench]]
name = "cli_benchmarks"
harness = false

[profile.release]
codegen-units = 1
lto = true
panic = "abort"